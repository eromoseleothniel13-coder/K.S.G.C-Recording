<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>K.S.G.C Recordings - Admin Login</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- HEADER -->
    <header class="site-header">
        <div class="header-inner">
            <div class="logo">K.S.G.C Recordings</div>

            <nav>
                <a href="/">Home</a>
            </nav>
        </div>
    </header>


    <!-- LOGIN SECTION -->
    <main class="login-page">

        <div class="login-card">

            <div class="login-icon">
                🔐
            </div>

            <h1>Admin Login</h1>

            <p class="login-description">
                Sign in to manage K.S.G.C Recordings.
            </p>

            <form id="loginForm">

                <div class="form-group">
                    <label for="email">Email Address</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >
                </div>


                <button type="submit" class="login-button">
                    Login
                </button>

                <p id="message" class="login-message"></p>

            </form>

        </div>

    </main>


    <!-- FOOTER -->
    <footer class="site-footer">
        <p>© 2026 K.S.G.C Recordings. All Rights Reserved.</p>
    </footer>


    <!-- LOGIN SCRIPT -->
    <script>

        const loginForm = document.getElementById("loginForm");
        const message = document.getElementById("message");

        loginForm.addEventListener("submit", async function(event) {

            event.preventDefault();

            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;

            message.textContent = "Connecting to secure login...";
            message.className = "login-message";

            try {

                const response = await fetch("/api/login", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        email: email,
                        password: password
                    })

                });

                const data = await response.json();

                if (response.ok) {

                    message.textContent = "Login successful. Opening admin portal...";

                    setTimeout(function() {
                        window.location.href = "/admin.html";
                    }, 500);

                } else {

                    message.textContent = data.message || "Login failed.";
                    message.className = "login-message error";

                }

            } catch (error) {

                message.textContent =
                    "Unable to connect to the server. Make sure the server is running.";

                message.className = "login-message error";

            }

        });

    </script>

    <script src="script.js"></script>

</body>
</html>
